<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment OTB · Grupo Piagui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F0F3F8;
    --paper-2:#E4E9F1;
    --ink:#0A1B33;
    --navy:#04142B;
    --azul:#004A99;
    --azul-2:#1D6FD1;
    --oro:#D9A400;
    --oro-2:#FFD700;
    --rojo:#D0103F;
    --verde:#3E9142;
    --line:#CBD5E3;
    --card:#FFFFFF;
    --muted:#5C6B82;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,h3,.disp{font-family:'Montserrat',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .app{max-width:840px;margin:0 auto;padding:28px 20px 80px;}

  /* ===== HEADER / OTB BAR (signature element) ===== */
  .otb-header{background:var(--navy);border-radius:18px;padding:22px 24px 18px;color:#fff;margin-bottom:22px;}
  .otb-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .otb-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8FA6C9;font-weight:600;}
  .otb-title{font-size:19px;font-weight:800;margin:4px 0 0;letter-spacing:-.01em;}
  .otb-readout{text-align:right;}
  .otb-readout .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8FA6C9;}
  .otb-readout .val{font-size:22px;font-weight:600;color:var(--oro-2);}
  .otb-track{margin-top:16px;height:10px;border-radius:6px;background:#132846;overflow:hidden;position:relative;}
  .otb-fill{height:100%;background:linear-gradient(90deg,var(--oro) 0%,var(--oro-2) 100%);border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .otb-blocks{display:flex;gap:3px;margin-top:8px;}
  .otb-block{flex:1;height:4px;border-radius:2px;background:#132846;}
  .otb-block.done{background:var(--oro-2);}

  /* ===== CARD / STEP ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 22px;box-shadow:0 1px 2px rgba(10,27,51,.04);}
  .step-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--azul-2);font-weight:700;margin-bottom:6px;}
  .step-title{font-size:22px;font-weight:800;margin:0 0 6px;letter-spacing:-.01em;}
  .step-sub{color:var(--muted);font-size:14.5px;line-height:1.5;margin:0 0 20px;}
  .cluster-ref{background:var(--paper-2);border-radius:10px;padding:14px 16px;margin-bottom:22px;font-size:13px;color:var(--ink);line-height:1.6;}
  .cluster-ref b{color:var(--azul);}
  .cluster-ref ul{margin:6px 0 0;padding-left:18px;}
  .skip-toggle{display:flex;align-items:center;gap:10px;background:var(--paper-2);border:1.5px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:20px;cursor:pointer;font-size:13.5px;color:var(--muted);transition:all .12s;}
  .skip-toggle:hover{border-color:var(--azul-2);}
  .skip-toggle.sel{background:#EAF1FB;border-color:var(--azul-2);color:var(--azul);font-weight:600;}
  .skip-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .skip-toggle.sel .skip-box{background:var(--azul);border-color:var(--azul);}
  .skip-note{background:var(--paper-2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .submit-warning{background:#FFF4E0;border:1.5px solid var(--oro);color:#7A5A00;border-radius:10px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:8px;}

  .field{margin-bottom:22px;}
  .field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:8px;color:var(--ink);}
  .field .hint{font-weight:400;color:var(--muted);font-size:12.5px;display:block;margin-top:2px;}
  input[type=text],input[type=email],textarea,select{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-family:'Inter';
    font-size:14.5px;background:#fff;color:var(--ink);transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--azul-2);}
  textarea{resize:vertical;min-height:70px;}

  .scale{display:flex;gap:8px;}
  .scale button{flex:1;padding:11px 4px;border-radius:9px;border:1.5px solid var(--line);background:#fff;
    font-family:'IBM Plex Mono';font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .12s;}
  .scale button:hover{border-color:var(--azul-2);}
  .scale button.sel{background:var(--azul);border-color:var(--azul);color:#fff;}
  .scale-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;}
  .scale.dolor button.sel{background:var(--rojo);border-color:var(--rojo);}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;
    cursor:pointer;color:var(--ink);transition:all .12s;}
  .chip.sel{background:var(--azul);border-color:var(--azul);color:#fff;}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;}
  .btn{border:none;border-radius:10px;padding:12px 22px;font-family:'Inter';font-weight:700;font-size:14.5px;cursor:pointer;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--azul);color:#fff;}
  .btn-ghost{background:transparent;color:var(--muted);}
  .btn-ghost:hover{color:var(--ink);opacity:1;}
  .btn[disabled]{opacity:.4;cursor:not-allowed;}

  .foot-link{text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted);}
  .foot-link a{color:var(--azul);cursor:pointer;text-decoration:none;font-weight:600;}
  .foot-link a:hover{text-decoration:underline;}

  /* ===== DONE SCREEN ===== */
  .done-wrap{text-align:center;padding:40px 20px;}
  .done-check{width:56px;height:56px;border-radius:50%;background:var(--verde);color:#fff;display:flex;
    align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;}

  /* ===== ADMIN ===== */
  .admin-gate{max-width:360px;margin:80px auto;text-align:center;}
  .admin-row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);
    border-radius:12px;padding:16px 18px;margin-bottom:10px;}
  .admin-row .name{font-weight:700;font-size:14.5px;}
  .admin-row .bar-bg{width:100%;height:8px;background:var(--paper-2);border-radius:4px;overflow:hidden;margin-top:8px;}
  .admin-row .bar-fg{height:100%;background:var(--oro);border-radius:4px;}
  .admin-row .bar-fg.dolor{background:var(--rojo);}
  .admin-meta{display:flex;gap:18px;font-size:12px;color:var(--muted);margin-top:4px;}
  .admin-tag{display:inline-block;font-size:11px;background:var(--paper-2);color:var(--azul);padding:2px 8px;border-radius:6px;margin-right:6px;}
  .admin-note{background:var(--paper-2);border-radius:8px;padding:9px 11px;font-size:12.5px;margin-top:6px;line-height:1.5;}
  .empty-state{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;}

  @media(max-width:560px){
    .otb-top{flex-direction:column;} .otb-readout{text-align:left;}
    .scale button{padding:9px 2px;font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   DATA MODEL — Clusters de discovery OTB Piagui
   ============================================================ */
const CLUSTERS = [
  {
    id:'planeacion',
    titulo:'Planeación y Compra (OTB)',
    ref:['OTB (plan de compra), ventas, inventario, MKDs, coberturas MOS','Forecast de ventas a 3 años y OTB a un año',
         'Assortment Plan a nivel silueta / modelo / SKU','Propuesta de compra a nivel clasificación, silueta, modelo, SKU, talla, tienda',
         'Propuesta de compra a nivel clúster de tiendas']
  },
  {
    id:'rentabilidad',
    titulo:'Margen y Rentabilidad',
    ref:['Factor margen o rentabilidad dentro del análisis','Análisis de rentabilidad (ROI)',
         'Reporte de SKUs con mayor rentabilidad y propuestas para mantenerlos']
  },
  {
    id:'inventario',
    titulo:'Inventario y Reabasto',
    ref:['Propuestas de reabasto o envío a tienda','Propuesta de traspasos entre tiendas',
         'Manejo de sobre-inventario / rotación de inventario','Análisis de ventas para generar propuesta de MKD']
  },
  {
    id:'ejecucion',
    titulo:'Ejecución y Nivel de Servicio',
    ref:['Stock out, venta perdida, negados, service level','Evaluación de ejecución plan vs. real',
         'Reporte de Best Sellers y Slow Movers']
  },
  {
    id:'externos',
    titulo:'Factores Externos y Marcas Nuevas',
    ref:['Evaluación de factores macroeconómicos, clima, geográficos, sociales',
         'Integración de colecciones nuevas (catalogadas) para decisión de compra vs. plan OTB',
         'Benchmark o plan de ventas a nivel silueta para marcas nuevas sin histórico (copia de otra marca base)']
  },
  {
    id:'gobierno',
    titulo:'Gobierno, Escenarios y Omnicanal',
    ref:['Funcionalidad de evaluar distintos escenarios guardando versiones','Funcionalidad de roles (asignación por usuario)',
         'Funcionalidad omnicanal','Integración de compras ejecutadas desde otras fuentes (no SAP)']
  }
];

const AREAS = ['Operaciones','Finanzas','Ventas / Comercial','TI','Dirección General','Otro'];
const FUENTES = ['SAP','Excel / macros locales','SharePoint','Power BI','Otro sistema'];

/* ============================================================
   STATE
   ============================================================ */
let mode = 'survey'; // survey | admin
let step = 0;
let resp = {
  nombre:'', area:'', puesto:'',
  baseline:'', baselineNum:'',
  fuentes:[],
  clusters:{}, // {clusterId: {prioridad, dolor, impacto, stoppers, skip}}
  casoAdicional:'',
  casoAdicionalPrioridad:null
};
CLUSTERS.forEach(c=> resp.clusters[c.id] = {prioridad:null, dolor:null, impacto:'', stoppers:'', skip:false});

const TOTAL_STEPS = 2 + CLUSTERS.length + 1; // contexto + fuentes(combined into contexto) ... define below precisely
// Steps layout: 0 = intro/contacto, 1 = contexto de datos, 2..7 = clusters, 8 = cierre
const STEP_COUNT = 2 + CLUSTERS.length + 1;

/* ============================================================
   STORAGE — vía Netlify Functions (custom-forms genérico)
   Este archivo se sirve desde /c/piagui-otb, así que las rutas
   relativas apuntan al dominio real (encuesta-ia.netlify.app).
   ============================================================ */
const FORM_SLUG = 'piagui-otb';

async function saveResponse(){
  try{
    const res = await fetch('/.netlify/functions/save-custom-response', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ slug: FORM_SLUG, data: resp })
    });
    return res.ok;
  }catch(e){ console.error('storage error',e); return false; }
}

async function loadAllResponses(adminPassword){
  const res = await fetch(`/.netlify/functions/list-custom-responses?slug=${FORM_SLUG}&adminPassword=${encodeURIComponent(adminPassword)}`);
  if(!res.ok) throw new Error(res.status===401?'unauthorized':'error');
  const data = await res.json();
  return data.responses || [];
}

/* ============================================================
   RENDER — SURVEY
   ============================================================ */
function otbHeader(){
  const pct = Math.round(((step)/(STEP_COUNT-1))*100);
  let blocks = '';
  for(let i=0;i<STEP_COUNT-1;i++){
    blocks += `<div class="otb-block ${i<step?'done':''}"></div>`;
  }
  return `
  <div class="otb-header">
    <div class="otb-top">
      <div>
        <div class="otb-eyebrow">Grupo Scanda · Discovery de casos de uso</div>
        <div class="otb-title">Assessment OTB — Grupo Piagui</div>
      </div>
      <div class="otb-readout">
        <div class="lbl">Open-to-Answer</div>
        <div class="val mono">${pct}%</div>
      </div>
    </div>
    <div class="otb-track"><div class="otb-fill" style="width:${pct}%"></div></div>
    <div class="otb-blocks">${blocks}</div>
  </div>`;
}

function renderScale(key, clusterId, kind){
  const val = resp.clusters[clusterId][key];
  let btns = '';
  for(let i=1;i<=5;i++){
    btns += `<button class="${val===i?'sel':''}" onclick="setScale('${clusterId}','${key}',${i})">${i}</button>`;
  }
  const labels = kind==='dolor' ? ['Sin fricción','','Moderado','','Crítico'] : ['Bajo','','Medio','','Muy alto'];
  return `<div class="scale ${kind}">${btns}</div><div class="scale-labels"><span>${labels[0]}</span><span>${labels[4]}</span></div>`;
}

function renderIntro(){
  return `
  <div class="card">
    <div class="step-eyebrow">Antes de empezar</div>
    <h2 class="step-title">¿Quién nos comparte esta perspectiva?</h2>
    <p class="step-sub">Este assessment toma 6–8 minutos. Tus respuestas se integran con las de otras áreas de Piagui
      para preparar el taller presencial de profundización.</p>
    <div class="field">
      <label>Nombre</label>
      <input type="text" id="f-nombre" value="${resp.nombre}" placeholder="Tu nombre">
    </div>
    <div class="field">
      <label>Área</label>
      <div class="chip-row">${AREAS.map(a=>`<div class="chip ${resp.area===a?'sel':''}" onclick="setArea('${a}')">${a}</div>`).join('')}</div>
    </div>
    <div class="field">
      <label>Puesto / rol <span class="hint">opcional</span></label>
      <input type="text" id="f-puesto" value="${resp.puesto}" placeholder="Ej. Gerente de Compras">
    </div>
    <div class="nav-row">
      <span></span>
      <button class="btn btn-primary" onclick="goNext()">Comenzar →</button>
    </div>
  </div>
  <div class="foot-link">¿Eres del equipo Scanda? <a onclick="goAdmin()">Ver resultados agregados</a></div>`;
}

function renderContexto(){
  return `
  <div class="card">
    <div class="step-eyebrow">Paso 1 de ${STEP_COUNT-1}</div>
    <h2 class="step-title">Contexto de datos y proceso actual</h2>
    <p class="step-sub">Estas respuestas nos ayudan a dimensionar el punto de partida real, no el ideal.</p>
    <div class="field">
      <label>¿Conoces la efectividad actual de tu forecast o plan de compra?</label>
      <div class="chip-row">
        ${['Sí, tengo el número','Tengo una idea aproximada','No lo sabemos / no se mide'].map(o=>
          `<div class="chip ${resp.baseline===o?'sel':''}" onclick="setBaseline('${o}')">${o}</div>`).join('')}
      </div>
    </div>
    ${resp.baseline==='Sí, tengo el número' ? `
    <div class="field">
      <label>¿Cuál es aproximadamente? <span class="hint">ej. "35% de error" o "65% de acierto"</span></label>
      <input type="text" id="f-baselineNum" value="${resp.baselineNum}" placeholder="Ej. 35% de error">
    </div>` : ''}
    <div class="field">
      <label>¿De dónde sale la información hoy para tomar decisiones de compra? <span class="hint">selecciona todas las que apliquen</span></label>
      <div class="chip-row">${FUENTES.map(f=>`<div class="chip ${resp.fuentes.includes(f)?'sel':''}" onclick="toggleFuente('${f}')">${f}</div>`).join('')}</div>
    </div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goPrev()">← Atrás</button>
      <button class="btn btn-primary" onclick="goNext()">Continuar →</button>
    </div>
  </div>`;
}

function renderCluster(idx){
  const c = CLUSTERS[idx];
  const stepNum = idx+2;
  const skipped = resp.clusters[c.id].skip;
  return `
  <div class="card">
    <div class="step-eyebrow">Paso ${stepNum} de ${STEP_COUNT-1}</div>
    <h2 class="step-title">${c.titulo}</h2>
    <div class="cluster-ref"><b>Funcionalidades incluidas en este bloque:</b>
      <ul>${c.ref.map(r=>`<li>${r}</li>`).join('')}</ul>
    </div>
    <div class="skip-toggle ${skipped?'sel':''}" onclick="toggleSkip('${c.id}')">
      <span class="skip-box">${skipped?'✓':''}</span>
      <span>No participo directamente en este proceso — prefiero omitirlo para no sesgar la respuesta</span>
    </div>
    ${skipped ? `
    <div class="skip-note">Bloque omitido. No se contará en tu respuesta — pasa al siguiente.</div>
    ` : `
    <div class="field">
      <label>¿Qué tan prioritario es resolver esto en los próximos 12 meses?</label>
      ${renderScale('prioridad', c.id, 'prioridad')}
    </div>
    <div class="field">
      <label>¿Qué tan doloroso / ineficiente es el proceso actual?</label>
      ${renderScale('dolor', c.id, 'dolor')}
    </div>
    <div class="field">
      <label>Si pudieras cuantificarlo: ¿cuál es el impacto de no resolverlo? <span class="hint">tiempo, $, servicio al cliente, etc. — abierto</span></label>
      <textarea id="f-impacto-${c.id}" onchange="setText('${c.id}','impacto',this.value)" placeholder="Ej. Rematamos ~8% del inventario por sobre-stock cada temporada...">${resp.clusters[c.id].impacto}</textarea>
    </div>
    <div class="field">
      <label>¿Qué te impediría avanzar hoy? <span class="hint">datos, sistemas, gente, presupuesto, decisión</span></label>
      <textarea id="f-stop-${c.id}" onchange="setText('${c.id}','stoppers',this.value)" placeholder="Ej. No tenemos histórico de inventario por tienda...">${resp.clusters[c.id].stoppers}</textarea>
    </div>
    `}
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goPrev()">← Atrás</button>
      <button class="btn btn-primary" onclick="goNext()">${idx === CLUSTERS.length-1 ? 'Continuar → Último paso (enviar)' : 'Continuar →'}</button>
    </div>
  </div>`;
}

function renderExtraScale(){
  const val = resp.casoAdicionalPrioridad;
  let btns = '';
  for(let i=1;i<=5;i++){
    btns += `<button class="${val===i?'sel':''}" onclick="setExtraPrioridad(${i})">${i}</button>`;
  }
  return `<div class="scale prioridad">${btns}</div><div class="scale-labels"><span>Bajo</span><span>Muy alto</span></div>`;
}

function renderCierre(){
  return `
  <div class="card">
    <div class="step-eyebrow">Paso ${STEP_COUNT-1} de ${STEP_COUNT-1} · Último paso</div>
    <h2 class="step-title">¿Hay algún tema prioritario que no cubrimos?</h2>
    <p class="step-sub">Los 6 bloques anteriores se basan en la lista que compartió Piagui, pero puede haber algo
      importante para tu área que no quedó ahí. Este es su espacio — completamente opcional.</p>
    <div class="field">
      <label>Tema o caso de uso adicional <span class="hint">opcional</span></label>
      <textarea id="f-caso" onchange="setCasoAdicional(this.value)" placeholder="Describe brevemente de qué se trata y por qué importa...">${resp.casoAdicional}</textarea>
    </div>
    ${resp.casoAdicional.trim() ? `
    <div class="field">
      <label>¿Qué tan prioritario dirías que es este tema?</label>
      ${renderExtraScale()}
    </div>` : ''}
    <div class="submit-warning">⚠️ Tus respuestas todavía no se han guardado — dale clic a "Enviar respuestas" para terminar.</div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="goPrev()">← Atrás</button>
      <button class="btn btn-primary" onclick="submitAll()">Enviar respuestas ✓</button>
    </div>
  </div>`;
}

function renderDone(){
  return `
  <div class="card done-wrap">
    <div class="done-check">✓</div>
    <h2 class="step-title">Gracias, ${resp.nombre||'colega'}.</h2>
    <p class="step-sub">Tu perspectiva ya quedó integrada. El equipo de Scanda usará estas respuestas para preparar
      el taller presencial de profundización y arquitectura de solución.</p>
  </div>`;
}

function renderSurvey(){
  let body = '';
  if(step===0) body = renderIntro();
  else if(step===1) body = renderContexto();
  else if(step>=2 && step < 2+CLUSTERS.length) body = renderCluster(step-2);
  else if(step===STEP_COUNT-1 && !window.__submitted) body = renderCierre();
  else body = renderDone();

  document.getElementById('app').innerHTML = otbHeader() + body;
}

/* ============================================================
   ADMIN
   ============================================================ */
async function renderAdminGate(){
  document.getElementById('app').innerHTML = `
    <div class="admin-gate card">
      <h2 class="step-title" style="text-align:center">Panel de resultados</h2>
      <p class="step-sub" style="text-align:center">Uso interno · equipo Grupo Scanda</p>
      <input type="text" id="admin-pass" placeholder="Passcode" style="text-align:center;margin-bottom:12px">
      <button class="btn btn-primary" style="width:100%" onclick="checkAdmin()">Entrar</button>
      <div class="foot-link"><a onclick="goSurveyFromAdmin()">← Volver al assessment</a></div>
    </div>`;
}

function checkAdmin(){
  const v = document.getElementById('admin-pass').value;
  renderAdminResults(v);
}

async function renderAdminResults(adminPassword){
  document.getElementById('app').innerHTML = `<div class="empty-state">Cargando respuestas…</div>`;
  let all;
  try{
    all = await loadAllResponses(adminPassword);
  }catch(e){
    document.getElementById('app').innerHTML = `
      <div class="admin-gate card">
        <h2 class="step-title" style="text-align:center">Passcode incorrecto</h2>
        <input type="text" id="admin-pass" placeholder="Passcode" style="text-align:center;margin-bottom:12px">
        <button class="btn btn-primary" style="width:100%" onclick="checkAdmin()">Entrar</button>
        <div class="foot-link"><a onclick="goSurveyFromAdmin()">← Volver al assessment</a></div>
      </div>`;
    return;
  }
  if(all.length===0){
    document.getElementById('app').innerHTML = `
      <div class="card">
        <h2 class="step-title">Panel de resultados</h2>
        <div class="empty-state">Aún no hay respuestas registradas.</div>
        <div class="foot-link"><a onclick="goSurveyFromAdmin()">← Volver al assessment</a></div>
      </div>`;
    return;
  }

  // Aggregate per cluster
  const agg = {};
  CLUSTERS.forEach(c=> agg[c.id] = {prioridad:[], dolor:[], impactos:[], stoppers:[], skipped:0});
  all.forEach(r=>{
    CLUSTERS.forEach(c=>{
      const d = r.clusters && r.clusters[c.id];
      if(!d) return;
      if(d.skip){ agg[c.id].skipped++; return; }
      if(d.prioridad) agg[c.id].prioridad.push(d.prioridad);
      if(d.dolor) agg[c.id].dolor.push(d.dolor);
      if(d.impacto) agg[c.id].impactos.push({area:r.area, txt:d.impacto});
      if(d.stoppers) agg[c.id].stoppers.push({area:r.area, txt:d.stoppers});
    });
  });
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length) : 0;

  const ranked = CLUSTERS.map(c=>{
    const p = avg(agg[c.id].prioridad), d = avg(agg[c.id].dolor);
    return {...c, p, d, urgencia:(p+d)/2, n:agg[c.id].prioridad.length, skipped:agg[c.id].skipped};
  }).sort((a,b)=>b.urgencia-a.urgencia);

  const rows = ranked.map(c=>`
    <div class="admin-row" style="flex-direction:column;align-items:stretch">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="name">${c.titulo}</span>
        <span class="mono" style="font-size:13px;color:var(--muted)">urgencia ${c.n?c.urgencia.toFixed(1):'—'}/5</span>
      </div>
      <div class="admin-meta">
        <span>Prioridad ${c.n?c.p.toFixed(1):'—'}</span><span>Dolor ${c.n?c.d.toFixed(1):'—'}</span>
        <span>n=${c.n} de ${all.length}${c.skipped?` · ${c.skipped} omitió por no estar involucrado`:''}</span>
      </div>
      <div class="bar-bg"><div class="bar-fg" style="width:${c.p/5*100}%"></div></div>
      <div class="bar-bg"><div class="bar-fg dolor" style="width:${c.d/5*100}%"></div></div>
      ${agg[c.id].stoppers.slice(0,3).map(s=>`<div class="admin-note"><span class="admin-tag">${s.area||'—'}</span>${s.txt}</div>`).join('')}
    </div>`).join('');

  const extras = all.filter(r=>r.casoAdicional && r.casoAdicional.trim());
  const extrasBlock = extras.length ? `
    <div class="card" style="margin-bottom:16px">
      <div class="step-eyebrow">Fuera de los 6 bloques</div>
      <h2 class="step-title" style="font-size:18px">Temas adicionales reportados</h2>
      <p class="step-sub">Mencionados libremente por respondientes — no forman parte del ranking anterior.</p>
      ${extras.map(r=>`<div class="admin-note">
        <span class="admin-tag">${r.area||'—'}</span>
        ${r.casoAdicionalPrioridad ? `<span class="admin-tag mono">prioridad ${r.casoAdicionalPrioridad}/5</span>` : ''}
        ${r.casoAdicional}
      </div>`).join('')}
    </div>` : '';

  const respTable = `
    <table>
      <tr><th>Nombre</th><th>Área</th><th>Puesto</th><th>Fecha</th></tr>
      ${all.map(r=>`<tr><td>${r.nombre||'—'}</td><td>${r.area||'—'}</td><td>${r.puesto||'—'}</td><td>${new Date(r.ts).toLocaleDateString()}</td></tr>`).join('')}
    </table>`;

  document.getElementById('app').innerHTML = `
    <div class="card" style="margin-bottom:16px">
      <div class="step-eyebrow">Panel de resultados · ${all.length} respuesta${all.length===1?'':'s'}</div>
      <h2 class="step-title">Ranking de urgencia por bloque</h2>
      <p class="step-sub">Urgencia = promedio de prioridad y dolor reportados, solo entre quienes sí participan en ese proceso. Ordenado de mayor a menor.</p>
      ${rows}
    </div>
    ${extrasBlock}
    <div class="card">
      <h3 class="step-title" style="font-size:17px">Respondientes</h3>
      ${respTable}
    </div>
    <div class="foot-link"><a onclick="goSurveyFromAdmin()">← Volver al assessment</a></div>`;
}

/* ============================================================
   ACTIONS
   ============================================================ */
function setArea(a){ resp.area = a; renderSurvey(); }
function setBaseline(o){ resp.baseline = o; renderSurvey(); }
function toggleFuente(f){
  const i = resp.fuentes.indexOf(f);
  if(i>-1) resp.fuentes.splice(i,1); else resp.fuentes.push(f);
  renderSurvey();
}
function setScale(clusterId,key,val){ resp.clusters[clusterId][key]=val; renderSurvey(); }
function setText(clusterId,key,val){ resp.clusters[clusterId][key]=val; }
function setCasoAdicional(v){ resp.casoAdicional = v; renderSurvey(); }
function setExtraPrioridad(v){ resp.casoAdicionalPrioridad = v; renderSurvey(); }
function toggleSkip(clusterId){
  const c = resp.clusters[clusterId];
  c.skip = !c.skip;
  if(c.skip){ c.prioridad=null; c.dolor=null; c.impacto=''; c.stoppers=''; }
  renderSurvey();
}

function captureCurrentInputs(){
  if(step===0){
    const n = document.getElementById('f-nombre'); if(n) resp.nombre = n.value;
    const p = document.getElementById('f-puesto'); if(p) resp.puesto = p.value;
  }
  if(step===1){
    const bn = document.getElementById('f-baselineNum'); if(bn) resp.baselineNum = bn.value;
  }
}

function goNext(){
  captureCurrentInputs();
  if(step < STEP_COUNT-1){ step++; window.scrollTo(0,0); renderSurvey(); }
}
function goPrev(){
  captureCurrentInputs();
  if(step>0){ step--; window.scrollTo(0,0); renderSurvey(); }
}
async function submitAll(){
  const btn = event.target; btn.disabled = true; btn.textContent = 'Enviando…';
  const ok = await saveResponse();
  window.__submitted = true;
  window.scrollTo(0,0);
  renderSurvey();
  if(!ok) console.warn('No se pudo guardar la respuesta, revisa la consola.');
}
function goAdmin(){ mode='admin'; renderAdminGate(); }
function goSurveyFromAdmin(){ mode='survey'; step=0; window.__submitted=false; renderSurvey(); }

/* INIT */
renderSurvey();
</script>
</body>
</html>
